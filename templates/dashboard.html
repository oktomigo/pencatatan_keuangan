{% extends "base.html" %}
{% block title %}Beranda — CatatUang{% endblock %}

{% block content %}
<section id="dashboard-page" aria-labelledby="dashboard-title" style="max-width:1200px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-20)">
  <header style="display:flex;align-items:end;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-5)">
    <div><p style="color:var(--color-text-secondary);font-size:var(--text-body-md);margin-bottom:var(--space-1)">Ringkasan</p><h1 id="dashboard-title" style="font-size:var(--text-heading-1);font-weight:700">Keuangan Bulan Ini</h1></div>
    <span id="dashboard-month" style="color:var(--color-text-secondary);font-size:var(--text-body-md)"></span>
  </header>
  <div id="dashboard-error" class="hidden" role="alert" style="padding:var(--space-4);margin-bottom:var(--space-4);border:1px solid var(--color-danger-500);border-radius:var(--rounded-md);background:var(--color-danger-50);color:var(--color-danger-700)"></div>
  <section id="saldo-card" aria-label="Ringkasan keuangan bulan ini" style="padding:var(--space-5);margin-bottom:var(--space-5);border-radius:var(--rounded-xl);background:var(--color-primary-500);color:#fff;box-shadow:var(--shadow-md)"><p style="font-size:var(--text-body-md);opacity:.9">Saldo bulan ini</p><p id="saldo-amount" class="tabular-nums" aria-live="polite" style="margin:var(--space-2) 0 var(--space-4);font-size:var(--text-display);font-weight:700">Rp 0</p><div style="display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--text-body-md)"><span id="income-amount">↑ Rp 0</span><span id="expense-amount">↓ Rp 0</span></div></section>
  <section id="budget-section" aria-labelledby="budget-title" style="margin-bottom:var(--space-5)"><h2 id="budget-title" style="font-size:var(--text-heading-2);margin-bottom:var(--space-3)">Status anggaran</h2><div id="budget-chips" role="list" style="display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:var(--space-1)"></div></section>
  <section id="bills-section" aria-labelledby="bills-title" style="margin-bottom:var(--space-5)"><h2 id="bills-title" style="font-size:var(--text-heading-2);margin-bottom:var(--space-3)">Tagihan jatuh tempo</h2><div id="bills-list"></div></section>
  <section id="recent-section" aria-labelledby="recent-title"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)"><h2 id="recent-title" style="font-size:var(--text-heading-2)">Transaksi terbaru</h2><a href="/transactions" style="min-height:44px;display:grid;place-items:center">Lihat semua</a></div><div id="recent-transactions" aria-live="polite"></div></section>
</section>
{% endblock %}

{% block scripts %}
<script type="module">
  import { init } from "{{ url_for('static', filename='js/dashboard.js') }}";
  init();
</script>
{% endblock %}
