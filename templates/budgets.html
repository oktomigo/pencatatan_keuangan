{% extends "base.html" %}
{% block title %}Anggaran — CatatUang{% endblock %}

{% block content %}
<section id="budgets-page" aria-labelledby="budgets-title" style="max-width:820px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-20)"><header style="margin-bottom:var(--space-5)"><p style="color:var(--color-text-secondary);font-size:var(--text-body-md)">Rencana pengeluaran</p><h1 id="budgets-title" style="font-size:var(--text-heading-1);font-weight:700">Anggaran</h1></header><div id="budgets-error" class="hidden" role="alert"></div><div id="budgets-empty" class="hidden" role="status">Belum ada anggaran. Pilih kategori untuk mulai mengatur batas pengeluaran.</div><div id="budgets-list" aria-live="polite"></div><div id="unbudgeted-section" class="hidden" style="margin-top:var(--space-6)"><h2 style="font-size:var(--text-heading-2);margin-bottom:var(--space-3)">Belum dianggarkan</h2><div id="unbudgeted-list"></div></div></section>
{% endblock %}

{% block scripts %}
<script type="module">
  import { init } from "{{ url_for('static', filename='js/budgets.js') }}";
  init();
</script>
{% endblock %}
