{% extends "base.html" %}
{% block title %}Ekspor Data — CatatUang{% endblock %}

{% block content %}
<section id="export-page" aria-labelledby="export-title" class="max-w-2xl mx-auto px-4 py-6 md:py-8 space-y-6">

  <!-- Header -->
  <header class="pb-2 border-b border-stone-200/60">
    <p class="text-xs sm:text-sm font-medium text-stone-500 mb-0.5">Simpan Arsip & Dokumen</p>
    <h1 id="export-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-stone-900">
      Ekspor Data Keuangan
    </h1>
  </header>

  <!-- Format Selection Card -->
  <div class="card-fintech p-5 space-y-3">
    <label class="block text-sm font-bold text-stone-800">
      Pilih Format Dokumen
    </label>
    <div class="grid grid-cols-2 gap-3">
      <button id="fmt-excel"
              type="button"
              class="btn btn-secondary active flex items-center justify-center gap-2 p-3 font-semibold border-2 border-teal-500 text-teal-800 bg-teal-50/50">
        <i data-lucide="file-spreadsheet" class="w-5 h-5 text-emerald-600"></i>
        <span>Excel (.xlsx)</span>
      </button>
      <button id="fmt-pdf"
              type="button"
              class="btn btn-secondary flex items-center justify-center gap-2 p-3 font-semibold border-2 border-stone-200 text-stone-700">
        <i data-lucide="file-text" class="w-5 h-5 text-rose-600"></i>
        <span>PDF Dokumen</span>
      </button>
    </div>
  </div>

  <!-- Period Selection Card -->
  <div class="card-fintech p-5 space-y-4">
    <label class="block text-sm font-bold text-stone-800">
      Pilih Rentang Waktu
    </label>
    <div id="export-periods" class="flex flex-wrap gap-2" role="group" aria-label="Periode ekspor">
      <button id="period-this-month" type="button" data-period="this-month" class="btn btn-secondary text-sm active">Bulan Ini</button>
      <button id="period-3-months" type="button" data-period="3-months" class="btn btn-secondary text-sm">3 Bulan Terakhir</button>
      <button id="period-6-months" type="button" data-period="6-months" class="btn btn-secondary text-sm">6 Bulan Terakhir</button>
      <button id="period-this-year" type="button" data-period="this-year" class="btn btn-secondary text-sm">Tahun Ini</button>
      <button id="period-custom" type="button" data-period="custom" class="btn btn-secondary text-sm">Rentang Kustom</button>
    </div>

    <!-- Custom Date Range -->
    <div id="export-custom-range" class="hidden pt-3 border-t border-stone-100 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2">
        <label for="export-start" class="text-xs font-semibold text-stone-600">Mulai:</label>
        <input id="export-start" type="date" aria-label="Tanggal mulai" class="form-input text-sm">
      </div>
      <div class="flex items-center gap-2">
        <label for="export-end" class="text-xs font-semibold text-stone-600">Sampai:</label>
        <input id="export-end" type="date" aria-label="Tanggal akhir" class="form-input text-sm">
      </div>
      <p id="export-range-error" class="hidden text-xs font-semibold text-red-600 bg-red-50 px-2.5 py-1.5 rounded-md" role="alert">
        Tanggal mulai tidak boleh setelah tanggal akhir
      </p>
    </div>
  </div>

  <!-- Preview & Status Card -->
  <div class="card-fintech p-5 space-y-4 bg-stone-50/50">
    <div class="flex items-center justify-between">
      <span class="text-xs font-semibold uppercase tracking-wider text-stone-400">Ringkasan Ekspor</span>
      <i data-lucide="info" class="w-4 h-4 text-stone-400"></i>
    </div>
    <p id="export-preview" class="text-sm font-semibold text-stone-800">
      Memuat pratinjau data...
    </p>
    <div id="export-status" role="status" aria-live="polite" class="text-xs text-stone-500"></div>

    <button id="btn-export"
            type="button"
            class="btn btn-primary w-full py-3 text-base shadow-md shadow-teal-700/20">
      <i data-lucide="download" class="w-5 h-5"></i>
      <span>Unduh Berkas Sekarang</span>
    </button>
  </div>

</section>
{% endblock %}

{% block scripts %}
<script type="module">
  import { init } from "{{ url_for('static', filename='js/export.js') }}";
  init();
</script>
{% endblock %}
