{% extends "base.html" %}
{% block title %}Ekspor Data — CatatUang{% endblock %}

{% block content %}
<section id="export-page" aria-labelledby="export-title" style="max-width:720px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-20)"><header style="margin-bottom:var(--space-5)"><p style="color:var(--color-text-secondary);font-size:var(--text-body-md)">Simpan arsip keuangan</p><h1 id="export-title" style="font-size:var(--text-heading-1);font-weight:700">Ekspor Data</h1></header><div><button id="fmt-excel" type="button">Excel (.xlsx)</button><button id="fmt-pdf" type="button">PDF</button></div><h2>Periode</h2><div id="export-periods"><button id="period-this-month" type="button" data-period="this-month">Bulan ini</button><button id="period-3-months" type="button" data-period="3-months">3 bulan</button><button id="period-6-months" type="button" data-period="6-months">6 bulan</button><button id="period-this-year" type="button" data-period="this-year">Tahun ini</button><button id="period-custom" type="button" data-period="custom">Kustom</button></div><div id="export-custom-range" class="hidden"><input id="export-start" type="date" aria-label="Tanggal mulai"><input id="export-end" type="date" aria-label="Tanggal akhir"><p id="export-range-error" class="hidden" role="alert">Tanggal mulai tidak boleh setelah tanggal akhir</p></div><p id="export-preview"></p><div id="export-status" role="status" aria-live="polite"></div><button id="btn-export" type="button">Ekspor sekarang</button></section>
{% endblock %}

{% block scripts %}
<script type="module">
  import { init } from "{{ url_for('static', filename='js/export.js') }}";
  init();
</script>
{% endblock %}
