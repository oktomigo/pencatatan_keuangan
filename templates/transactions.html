{% extends "base.html" %}
{% block title %}Transaksi — CatatUang{% endblock %}

{% block content %}
<section id="transactions-page" aria-labelledby="transactions-title" style="max-width:820px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-20)">
  <header style="margin-bottom:var(--space-5)"><p style="color:var(--color-text-secondary);font-size:var(--text-body-md);margin-bottom:var(--space-1)">Catatan harian</p><h1 id="transactions-title" style="font-size:var(--text-heading-1);font-weight:700">Transaksi</h1></header>
  <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-3)"><input id="search-input" type="search" placeholder="Cari catatan atau kategori" aria-label="Cari transaksi" style="flex:1;min-width:220px;min-height:44px;padding:0 var(--space-3);border:1px solid var(--color-border-light);border-radius:var(--rounded-md);background:var(--color-surface-card)"><select id="category-filter" aria-label="Filter kategori" style="min-height:44px;padding:0 var(--space-3);border:1px solid var(--color-border-light);border-radius:var(--rounded-md);background:var(--color-surface-card)"><option value="">Semua kategori</option></select></div>
  <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-3);flex-wrap:wrap"><button id="filter-all" type="button" data-filter="all" class="active" style="min-height:44px;padding:0 var(--space-3);border-radius:var(--rounded-md)">Semua</button><button id="filter-income" type="button" data-filter="income" style="min-height:44px;padding:0 var(--space-3);border-radius:var(--rounded-md)">Pemasukan</button><button id="filter-expense" type="button" data-filter="expense" style="min-height:44px;padding:0 var(--space-3);border-radius:var(--rounded-md)">Pengeluaran</button><input id="period-month" type="number" min="1" max="12" placeholder="Bulan" aria-label="Bulan" style="width:92px;min-height:44px;padding:0 var(--space-2);border:1px solid var(--color-border-light);border-radius:var(--rounded-md)"><input id="period-year" type="number" min="2000" max="9999" placeholder="Tahun" aria-label="Tahun" style="width:110px;min-height:44px;padding:0 var(--space-2);border:1px solid var(--color-border-light);border-radius:var(--rounded-md)"></div>
  <div id="transactions-error" class="hidden" role="alert"></div><div id="transactions-empty" class="hidden" role="status">Belum ada transaksi pada periode ini.</div><div id="transaction-list" aria-live="polite"></div><button id="transactions-load-more" type="button" class="hidden">Muat lebih banyak</button>
</section>
{% endblock %}

{% block scripts %}
<script type="module">
  import { init } from "{{ url_for('static', filename='js/transactions.js') }}";
  init();
</script>
{% endblock %}
